<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Redirect to main app -->
    <meta http-equiv="refresh" content="0; url=/">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2d5a2c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZASS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileImage" content="/icons/icon-144.png">
    <meta name="msapplication-TileColor" content="#2d5a2c">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="shortcut icon" href="/icons/icon-96.png">
    
    <title>ZASS AI Agent</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a2e0a, #1a4a1a, #2d5a2c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: url('/icons/icon-192.png') center/contain no-repeat;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff, #aaffaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p {
            font-size: 18px;
            color: #ddd;
            margin-bottom: 30px;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .install-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            transition: transform 0.3s;
        }
        .install-btn:hover {
            transform: translateY(-2px);
        }
        a {
            color: #aaffaa;
            text-decoration: none;
        }
        .status {
            font-size: 12px;
            color: #888;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <div class="loader"></div>
        <h1>ZASS AI Agent</h1>
        <p>Redirecting to <a href="/">ZASS AI Agent Dashboard</a>...</p>
        <button class="install-btn" id="installBtn">📱 Install App</button>
        <div class="status">
            <span id="pwaStatus">Checking PWA support...</span>
        </div>
    </div>

    <script>
        // Check if PWA is supported
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('✅ Service Worker registered:', registration);
                    document.getElementById('pwaStatus').innerHTML = '✅ PWA ready - You can install this app';
                })
                .catch(error => {
                    console.log('❌ Service Worker registration failed:', error);
                    document.getElementById('pwaStatus').innerHTML = '⚠️ PWA not fully supported';
                });
        } else {
            document.getElementById('pwaStatus').innerHTML = '⚠️ Your browser does not support PWA';
        }
        
        // Handle app installation
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('installBtn');
            installBtn.style.display = 'block';
            document.getElementById('pwaStatus').innerHTML = '📱 Click "Install App" to add ZASS to your home screen';
            
            installBtn.addEventListener('click', () => {
                installBtn.style.display = 'none';
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('✅ User accepted install');
                        document.getElementById('pwaStatus').innerHTML = '✅ App installed successfully!';
                    } else {
                        console.log('❌ User dismissed install');
                        document.getElementById('pwaStatus').innerHTML = '❌ Installation cancelled';
                    }
                    deferredPrompt = null;
                });
            });
        });
        
        // Handle app already installed
        window.addEventListener('appinstalled', () => {
            console.log('🎉 App was installed');
            document.getElementById('pwaStatus').innerHTML = '🎉 ZASS is now installed on your device!';
        });
        
        // Auto redirect after 2 seconds
        setTimeout(() => {
            window.location.href = '/';
        }, 2000);
    </script>
</body>
</html>
